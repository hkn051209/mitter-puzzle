<title>みったーパズル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<style>
/* 夜空の部屋。盤面が主役で、まわりは静かに。見出しは丸い明朝(Kiwi Maru)、本文は丸ゴシック */
*,*::before,*::after{box-sizing:border-box}
:root{
  --sky:#101833; --sky2:#1b2650; --panel:#1a2448; --panel2:#233063;
  --line:#33417a; --ink:#eef1ff; --muted:#9ba7d4;
  --peach:#ffb48c; --star:#ffe7a3; --star-ink:#3a2a10; --warn:#ff8f8f; --say:#fff6d6;
  --display:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--sky);color:var(--ink);margin:0;height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.6;padding-block:6px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% -10%,#26357a 0%,transparent 60%),var(--sky);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
h2,h3,.display{font-family:var(--display);font-weight:500;text-wrap:balance}
button{font-family:var(--body);cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.g-top{display:flex;align-items:center;gap:10px}
.bgm-t{flex:none;border:1px solid var(--star);background:var(--star);color:var(--star-ink);border-radius:999px;padding:6px 12px;font:500 12px var(--body);white-space:nowrap}
.bgm-t.off{background:transparent;color:var(--muted);border-color:var(--line)}
.sp-bgm{position:absolute;top:12px;right:12px;z-index:4}.sp-bgm .bgm-t.off{background:rgba(16,24,51,.7)}.g-top h2{flex:1;font-size:18px;margin:6px 0}
.g-body{display:flex;flex-direction:column;gap:12px;flex:1}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;white-space:nowrap}
.sbtn{border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink);padding:9px 14px;font-size:13px}.sbtn.on{background:var(--star);color:var(--star-ink);border-color:var(--star)}
.primary{border:0;border-radius:999px;background:linear-gradient(180deg,#ffc8a3,#ff9e7a);color:#4a1d10;font-family:var(--display);font-weight:700;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.25);padding:10px 18px;font-size:15px}
.primary:active,.menu-b:active{transform:scale(.95)}.primary.big{font-size:20px;padding:14px 40px}
.primary:disabled{opacity:.45}
.note{font-size:12px;color:var(--muted);margin:0;text-align:center}
.vs-say{margin:0;min-height:1.6em;font-family:var(--display);font-size:16px;text-align:center;color:var(--say)}.vs-say:empty{visibility:hidden}

/* タイトル */
.ttl{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.logo-img{margin:0;width:min(88%,340px);line-height:0}.logo-img img{width:100%;display:block}
.splash .logo-img{position:relative;z-index:2;margin-top:8px;width:min(56%,220px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.op-s .logo-img{width:min(92%,360px)}.roll-in .logo-img{width:min(80%,300px)}
.logo{margin:4px 0 0;font:500 34px/1.15 var(--display);letter-spacing:.04em;color:var(--star);text-shadow:0 0 18px rgba(255,231,163,.35)}
.logo small{display:block;font-size:15px;letter-spacing:.5em;color:var(--peach);margin-top:4px}
.ttl-art{width:min(100%,330px);line-height:0;margin:-6px 0 -4px}.ttl-art img{width:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%)}
.ttl-chars{display:flex;justify-content:center;align-items:flex-end;gap:0;height:150px}.ttl-chars .ch{height:100%}.ttl-chars .ch:nth-child(1),.ttl-chars .ch:nth-child(3){height:78%;opacity:.9}
.menu{display:grid;gap:10px;width:100%;max-width:300px}
.menu-b{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:12px 16px;font:500 18px var(--display);color:var(--ink)}
.menu-b small{font:400 11px var(--body);color:var(--muted)}
.menu-b.main{background:linear-gradient(180deg,#ffc8a3,#ff9e7a);border:0;color:#4a1d10;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.25)}.menu-b.main small{color:#7a3a20}
.notice{width:100%;max-width:300px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.notice h3{margin:0 0 4px;font-size:13px;letter-spacing:.2em;color:var(--peach)}
.notice ul{margin:0;padding-left:1.2em;font-size:13px;line-height:1.7;color:var(--ink)}
.menu-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* キャラの絵 */
.ch{display:block;aspect-ratio:2/3;max-width:100%}.ch.pair{aspect-ratio:3/2}
.ch img,.ch svg{width:100%;height:100%;object-fit:contain;display:block}
.ch.img img{object-position:50% 0}
.pvs-ic .ch.img,.rank .pvs-ic .ch.img{width:100%;height:100%;aspect-ratio:auto;transform:none}
.pvs-ic .ch.img img{object-fit:cover;object-position:50% 0;transform:scale(2.4);transform-origin:50% 4%}
.stg .ch.img{height:110px}
.cd{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cd b{font:500 84px/1 var(--display);color:var(--star);text-shadow:0 0 24px rgba(255,231,163,.6),0 4px 0 #5b3fa6;animation:cdpop .9s ease-out both}
.cd b.go{font-size:52px;color:#fff3c4}
@keyframes cdpop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.9);opacity:0}}

/* ストーリーの相手リスト */
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stg{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 8px 10px;text-align:center}
.stg .ch{height:96px}.stg .ch.pair{height:96px;aspect-ratio:3/2}
.stg b{font:500 15px var(--display)}.stg span{font-size:11px;color:var(--muted)}
.stg.lock{opacity:.55}
.stg .stg-q{display:flex;align-items:center;justify-content:center;width:74px;height:110px;font:500 46px var(--display);color:var(--muted);background:radial-gradient(circle,rgba(155,167,212,.18),transparent 70%)}
.stg.next{border-color:var(--star);box-shadow:0 0 0 1px var(--star) inset}
.stg .badge{position:absolute;top:6px;right:8px;font-size:11px;color:var(--star)}
.stg .num{position:absolute;top:6px;left:10px;font:500 12px var(--display);color:var(--muted)}

/* 会話の場面 */
.scene{position:relative;flex:1;min-height:440px;border-radius:18px;overflow:hidden;background:#2a3670 50% 60%/cover no-repeat;cursor:pointer}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,24,51,.15),rgba(16,24,51,.45))}
.sc-ch{position:absolute;bottom:118px;width:50%;z-index:1;transition:filter .25s,transform .25s}.sc-ch .ch{width:100%}.sc-ch .ch.pair{width:100%}
.sc-l{left:-2%}.sc-r{right:-2%}.sc-r.wide{width:66%;right:-4%}
.sc-ch.dim{filter:brightness(.5) saturate(.6);transform:scale(.95)}
.sc-ch.talk{transform:translateY(-4px)}
.sc-box{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;min-height:104px;background:rgba(16,24,51,.9);border:2px solid rgba(255,231,163,.5);border-radius:16px;padding:16px 16px 12px;font-size:16px;line-height:1.7}
.sc-box.nare{font-style:normal;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center}
.sc-name{position:absolute;top:-14px;left:14px;background:var(--star);color:var(--star-ink);border-radius:999px;padding:1px 14px;font:500 14px var(--display)}
.sc-next{position:absolute;right:14px;bottom:6px;color:var(--star);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sc-skip{position:absolute;top:10px;right:10px;z-index:3;background:rgba(16,24,51,.7)}

/* 対戦 */
.pvs{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center;flex:1}.pvs>.vs-say{margin:0;font-size:13px;min-height:1.4em}
.pvs-boards{display:flex;gap:10px;align-items:flex-end;justify-content:center;width:100%}
.pvs-me,.pvs-ru{display:flex;flex-direction:column;align-items:center;gap:3px}
.pvs-n{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pvs-ic{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--panel2);border:1px solid var(--line);flex:none}.pvs-ic .ch{width:100%;height:auto;transform:scale(1.9) translateY(18%)}.pvs-ic .ch.pair{transform:scale(1.4) translateY(10%)}
.pnl-wrap{position:relative;border-radius:14px;overflow:hidden;background:#2a3670 50% 70%/auto 120% no-repeat}
.pnl-wrap canvas{position:relative;display:block;border-radius:14px;touch-action:none;border:2px solid rgba(255,231,163,.35)}
.pnl-bg{position:absolute;left:-8%;right:-8%;top:0;opacity:.95;pointer-events:none}.pnl-bg .ch{width:100%}
.pnl-bg.big{left:-14%;right:-14%;top:-2%}
.pnl-b{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:380px;padding:0 6px 6px;margin-top:auto}
.pnl-r{display:flex;flex-direction:column;gap:6px;align-items:center}
.dpad{position:relative;width:172px;height:172px;flex:none;touch-action:none;cursor:pointer}
.dpad svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 0 #8a76c9) drop-shadow(0 7px 8px rgba(10,8,40,.35));transition:transform .28s cubic-bezier(.3,1.8,.5,1);pointer-events:none}
.dpad[data-on=u] svg{transform:perspective(240px) rotateX(16deg) translateY(2px) scale(.97);transition-duration:.06s}
.dpad[data-on=d] svg{transform:perspective(240px) rotateX(-16deg) translateY(2px) scale(.97);transition-duration:.06s}
.dpad[data-on=l] svg{transform:perspective(240px) rotateY(-16deg) translateY(2px) scale(.97);transition-duration:.06s}
.dpad[data-on=r] svg{transform:perspective(240px) rotateY(16deg) translateY(2px) scale(.97);transition-duration:.06s}
.dpad .ar{fill:#fff;opacity:.9;transition:fill .1s}.dpad .lit{fill:#fff;opacity:0;transition:opacity .1s}
.dpad[data-on=u] .ar-u,.dpad[data-on=d] .ar-d,.dpad[data-on=l] .ar-l,.dpad[data-on=r] .ar-r{fill:#fff1b8}
.dpad[data-on=u] .lit-u,.dpad[data-on=d] .lit-d,.dpad[data-on=l] .lit-l,.dpad[data-on=r] .lit-r{opacity:.35}
.dpad .dstar{transform-origin:50px 50px;transition:transform .28s cubic-bezier(.3,1.8,.5,1)}.dpad[data-on] .dstar{transform:scale(.9) rotate(-8deg)}
.swbtn{position:relative;width:136px;height:100px;padding:0;border:0;background:none;touch-action:none;cursor:pointer;transition:transform .32s cubic-bezier(.3,1.9,.5,1)}
.swbtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 0 #d77fa6) drop-shadow(0 7px 8px rgba(10,8,40,.35));pointer-events:none}
.swbtn span{position:relative;top:4px;font:700 19px var(--display);color:#fff;letter-spacing:.04em;text-shadow:0 1.5px 0 #d4689a,0 0 6px rgba(214,90,150,.55);pointer-events:none}
.swbtn.on{transform:scale(1.08,.8) translateY(6px);transition-duration:.06s}
.pnl-up{border:0;border-radius:999px;padding:7px 16px;background:linear-gradient(180deg,#ffd9ea,#f6a9cb);color:#7a2f55;font:600 13px var(--display);box-shadow:0 3px 0 #d77fa6;touch-action:none;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.pnl-up.on{transform:scale(1.06,.85) translateY(3px);box-shadow:0 0 0 #d77fa6;transition-duration:.05s}
.pvs,.pvs *{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}

/* エンドレス */
.end-row{display:flex;gap:10px;align-items:flex-start;justify-content:center;width:100%}
.end-side{display:flex;flex-direction:column;gap:8px;width:86px;flex:none}
.end-side .ch{width:100%}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:right}
.stat span{display:block;font-size:10px;color:var(--muted);text-align:left;letter-spacing:.05em}
.stat b{font:500 20px var(--display);color:var(--star);font-variant-numeric:tabular-nums}
.stat.sm b{font-size:16px;color:var(--ink)}

/* キャラえらび・結果・ランキング・せってい */
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 4px;font-size:11px}
.pick button .ch{height:70px}.pick button .ch.pair{height:70px}
.pick button.on{border-color:var(--star);background:var(--panel2);box-shadow:0 0 0 1px var(--star) inset}
.result{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}.result h2{margin:0;font-size:24px}
.r-ch{height:180px}.r-ch .ch{height:100%}
.r-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.r-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:320px}
.newbest{display:inline-block;background:var(--star);color:var(--star-ink);border-radius:999px;padding:1px 12px;font:500 13px var(--display)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.card h3{margin:0;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.code{font:500 12px/1.5 ui-monospace,"SFMono-Regular",Menlo,monospace;color:var(--ink);background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;-webkit-user-select:all;user-select:all}
textarea.code{width:100%;min-height:80px;resize:vertical;-webkit-user-select:text;user-select:text}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld input{font:inherit;font-size:16px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;justify-content:center}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank th{white-space:nowrap;font-weight:400;color:var(--muted);font-size:11px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.rank th:nth-child(2),.rank td:nth-child(2){text-align:left}
.rank td{padding:7px 6px;border-bottom:1px solid rgba(51,65,122,.5);text-align:right;font-variant-numeric:tabular-nums}
.rank td:first-child{font:500 15px var(--display);color:var(--muted);width:2.2em;text-align:center}
.rank tr.top1 td:first-child{color:var(--star)}.rank tr.top2 td:first-child{color:#dfe6ff}.rank tr.top3 td:first-child{color:var(--peach)}
.rank td b{font:500 15px var(--display);color:var(--star)}
.rank .nm{display:flex;align-items:center;gap:6px;min-width:0}.rank .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-wrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 8px;border:1px dashed var(--line);border-radius:14px}
.msg{font-size:12px;color:var(--star);text-align:center;min-height:1.4em;margin:0}
.msg.bad{color:var(--warn)}
.ovl{position:fixed;inset:0;z-index:20;background:rgba(10,14,32,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.ovl .card{max-width:320px;align-items:center;text-align:center}
.clear-ttl{font:500 28px var(--display);color:var(--star);margin:0}
/* タイトル画面 */
.splash{position:relative;flex:1;min-height:480px;border-radius:22px;overflow:hidden;background:#2a3670 50% 100%/cover no-repeat;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,24,51,.25),transparent 30%,transparent 78%,rgba(16,24,51,.8))}
.splash .logo{position:relative;z-index:2;margin-top:28px;font-size:44px;text-shadow:0 0 22px rgba(255,231,163,.6),0 3px 0 #5b3fa6}
.sp-cast{position:absolute;left:0;right:0;bottom:64px;height:50%;z-index:1;display:flex;justify-content:center;align-items:flex-end}
.sp-cast .ch{height:88%;margin:0 -12%}.sp-cast .ch:nth-child(2){height:100%;z-index:2}.sp-cast .ch:not(:nth-child(2)){filter:brightness(.8)}
.sp-tap{position:absolute;bottom:22px;z-index:3;font:500 18px var(--display);color:var(--star);letter-spacing:.2em;background:rgba(16,24,51,.72);border:1px solid rgba(255,231,163,.5);border-radius:999px;padding:6px 22px;text-shadow:0 1px 4px rgba(0,0,0,.6);animation:blink 1.4s steps(2) infinite}
/* オープニング */
.op{position:relative;flex:1;min-height:480px;border-radius:18px;overflow:hidden;background:#101833 50% 50%/cover no-repeat;cursor:pointer}
.op::after{content:"";position:absolute;inset:0;background:rgba(16,24,51,.45)}
.op-s{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;animation:opin .7s ease-out both}
.op-s p{font:500 20px/1.8 var(--display);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);margin:0;white-space:pre-line}
.op-s .ch{height:72%;animation:opch .8s cubic-bezier(.2,.9,.3,1.1) both}
.op-lb{font:500 13px var(--display);letter-spacing:.3em;color:var(--peach)}
.op-nm{font:500 30px var(--display);color:var(--star);text-shadow:0 0 16px rgba(255,231,163,.5),0 3px 0 #5b3fa6}
.op-s .logo{font-size:46px}
@keyframes opin{from{opacity:0}to{opacity:1}}
@keyframes opch{from{opacity:0;transform:translateX(30%)}to{opacity:1;transform:none}}
/* エンディング */
.roll{position:relative;flex:1;min-height:480px;border-radius:18px;overflow:hidden;background:#101833 50% 50%/cover no-repeat;cursor:pointer}
.roll::after{content:"";position:absolute;inset:0;background:rgba(10,14,32,.62);z-index:0}
.roll-in{position:absolute;left:0;right:0;top:100%;z-index:1;display:flex;flex-direction:column;align-items:center;gap:34px;padding:0 20px 40px;text-align:center;animation:rollup linear forwards}
.roll-in h3{margin:0;font-size:13px;letter-spacing:.35em;color:var(--peach)}
.roll-c{display:flex;flex-direction:column;align-items:center;gap:4px}.roll-c .ch{height:190px}
.roll-c b{font:500 22px var(--display);color:var(--star)}.roll-c span{font-size:12px;color:var(--muted)}
.roll-t{font:500 16px/1.9 var(--display);color:#fff}
.roll-end{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:36px;background:#101833 50% 50%/cover no-repeat;animation:opin 1.6s ease-out both}
.roll-end .clear-ttl{text-shadow:0 2px 12px rgba(0,0,0,.7)}.roll-end .note{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.roll-end .ch{height:55%}
@keyframes rollup{to{transform:translateY(calc(-100% - 100vh))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<!-- ===== 会話（シナリオ）=====
  もちゃおさんが書いたシナリオは、この下の「SCENARIO」の中身をまるごと入れかえる。
  形式：### プロローグ / ### ステージ1：名前 / [たいせんまえ] など（くわしくは README） -->
<script type="text/plain" id="SCENARIO">
### プロローグ
ナレ：星ふる夜空に、星屑タワーは立っている。
ナレ：年に一度のパネル大会が、今年も始まる。
凛花：……凛花です。人前に出るの、苦手です。
凛花：でも、パネルゲームの話なら別で……！

/* ===== 相手の考え方 =====

function padUI(root,B){
  ['touchstart','touchmove'].forEach(k=>root.addEventListener(k,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
  const pad=root.querySelector('.dpad');let dir='',rep=0,pid=null;
  const move=d=>{if(!B.paused&&!B.wait)B.move(d)};
  const stop=()=>{clearTimeout(rep);clearInterval(rep);rep=0};
  const dirAt=e=>{const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<r.width*.08)return dir;return Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d')};
  const set=d=>{if(d===dir)return;dir=d;if(d)pad.dataset.on=d;else delete pad.dataset.on;stop();if(!d)return;move(d);rep=setTimeout(()=>{rep=setInterval(()=>move(dir),90)},280)};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){}dir='';set(dirAt(e))});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(dirAt(e))});
  ['pointerup','pointercancel','lostpointercapture'].forEach(k=>pad.addEventListener(k,e=>{if(e.pointerId!==pid)return;pid=null;set('')}));
  const sw=root.querySelector('.swbtn');
  sw.addEventListener('pointerdown',e=>{e.preventDefault();sw.classList.add('on');if(!B.paused&&!B.wait&&B.swap())se('tap')});
  ['pointerup','pointercancel','pointerleave'].forEach(k=>sw.addEventListener(k,()=>sw.classList.remove('on')));
  const up=root.querySelector('.pnl-up');
  up.addEventListener('pointerdown',e=>{e.preventDefault();up.classList.add('on');if(!B.wait)B.boost=true});
  ['pointerup','pointerleave','pointercancel'].forEach(k=>up.addEventListener(k,()=>{up.classList.remove('on');B.boost=false}));
  // 盤面をタッチ・なぞると枠が動く
  const cv=root.querySelector('canvas.me');let drag=false;
  const to=e=>{const p=B.cellAt(e);if(p.r<0||p.r>=ROWS)return;B.curs={r:p.r,c:clamp(p.c,0,COLS-2)}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();if(B.paused)return;to(e);drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(drag&&!B.paused)to(e)});
  ['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>drag=false));
}

function battle(si){
  const st=STAGES[si],opp=CHARS[st.ch],SL=(SC.stages[si]||{}).b||{},HL=SC.hero;
  const mercy=REC.fails[si]>=3;   // 3回つづけて負けると、相手が少しだけ手加減
  const P=Object.assign({},st.ai);if(mercy){P.think*=1.2;P.miss=Math.min(.5,P.miss+.08)}
  let ended=false,raf=0,t0=performance.now();
  const body=shell(`${si+1}. ${esc(opp.name)}`,'ていし',()=>pauseMenu());
  body.innerHTML=`<div class="pvs" id="pvs"><p class="vs-say" id="pvS">しょうぶだよ！</p>
   <div class="pvs-boards"><div class="pvs-me"><div class="pnl-wrap" style="background-image:url(${IMG[st.bg]||IMG.bg})"><div class="pnl-bg" id="pvMi">${charHTML(HERO)}</div><canvas class="me" id="pvA" width="1" height="1"></canvas></div><span class="pvs-n">${esc(playerName())}</span></div>
    <div class="pvs-ru"><div class="pnl-wrap" style="background-image:url(${IMG[st.bg]||IMG.bg})"><div class="pnl-bg" id="pvF">${charHTML(st.ch)}</div><canvas id="pvB" width="1" height="1"></canvas></div><span class="pvs-n">${esc(opp.name)}</span></div></div>
   ${CTRL_HTML}</div>`;
  const avail=Math.min(body.clientWidth,420)-12,csA=Math.floor(Math.min(avail*.6/6,(viewH()-330)/12)),csB=Math.floor(Math.min(avail*.38/6,csA*.66));
  const say=t=>{if(t)$('#pvS').textContent=t};
  const faceT={};const face=(el,id,ex,hold)=>{const m=$(el);if(!m||ended&&!hold)return;m.innerHTML=charHTML(id,ex);clearTimeout(faceT[el]);if(!hold)faceT[el]=setTimeout(()=>{if(!ended&&$(el))$(el).innerHTML=charHTML(id,'normal')},1600)};
  const speed=el=>st.speed+Math.min(.4,el/320);
  let pinchMe=false,pinchRu=false,ready=false;
  const cd=countdown($('#pvs'),()=>{ready=true;me.wait=false;say('しょうぶ！')});
  const me=makePanelBoard($('#pvA'),csA,{speed,onClear:(n,ch,send)=>{if(send){ru.addGarbage(send);se('up');face('#pvMi',HERO,'attack');face('#pvF',st.ch,'pinch');say(pick(HL.attack||[])||'いけー！')}else se('catch')},onLose:()=>end(false)});
  const ru=makePanelBoard($('#pvB'),csB,{speed,onClear:(n,ch,send)=>{if(send){me.addGarbage(send);face('#pvF',st.ch,'attack');face('#pvMi',HERO,'pinch');say(pick(SL.attack||[])||(ch>1?`${ch}れんさ！`:'えい！'))}},onLose:()=>end(true)});
  const ai=makeAI(ru,P);me.wait=true;
  let paused=false;
  function loop(t){if(ended)return;const dt=Math.min(.05,(t-t0)/1000);t0=t;
    if(!paused&&!ready)cd(dt);
    else if(!paused){me.step(dt);ru.step(dt);ai(dt);
      const pm=me.high(9),pr=ru.high(9);
      if(pm&&!pinchMe){face('#pvMi',HERO,'pinch',true);if(Math.random()<.6)say(pick(HL.pinch||[]))}if(!pm&&pinchMe)face('#pvMi',HERO,'normal',true);
      if(pr&&!pinchRu){face('#pvF',st.ch,'pinch',true);say(pick(SL.pinch||[]))}if(!pr&&pinchRu)face('#pvF',st.ch,'normal',true);
      pinchMe=pm;pinchRu=pr;BGM.rate(pm?1.18:1)}
    me.draw();ru.draw();raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);BGM.start(si===STAGES.length-1?'boss':'battle');
  padUI($('#pvs'),me);
  const setPause=v=>{paused=me.paused=v;if(v)BGM.pause();else{t0=performance.now();BGM.resume()}};
  function pauseMenu(){if(ended)return;setPause(true);overlay(`<h3>ていし ちゅう</h3><button class="primary" data-k="go">つづける</button><button class="sbtn" data-k="retry">さいしょから</button><button class="ghost" data-k="quit">やめて もどる</button>`,k=>{
    if(k==='go')setPause(false);if(k==='retry'){cleanup();battle(si)}if(k==='quit'){cleanup();story()}})}
  const onVis=()=>{if(document.hidden&&!paused&&!ended)pauseMenu()};document.addEventListener('visibilitychange',onVis);
  function cleanup(){ended=true;cancelAnimationFrame(raf);BGM.rate(1);document.removeEventListener('visibilitychange',onVis);closeOverlay()}
  stopGame=cleanup;
  function end(win){if(ended)return;ended=true;BGM.rate(1);
    se(win?'up':'miss');face('#pvF',st.ch,win?'lose':'win',true);face('#pvMi',HERO,win?'win':'lose',true);
    say(win?(pick(SL.lose||[])||'まけたー！'):(pick(SL.win||[])||'やったー！'));
    setTimeout(()=>{cleanup();
      const first=win&&si===REC.prog;
      if(win){REC.wins++;REC.fails[si]=0;if(first)REC.prog=si+1}else{REC.losses++;REC.fails[si]++}
      REC.maxChain=Math.max(REC.maxChain,me.maxChain);saveRec();
      const S=SC.stages[si]||{};
      scene(win?S.win:S.lose,{opp:st.ch,bg:st.bg},()=>battleResult(si,win,first,me))},1700)}
  if(location.search.includes('debug'))window.__pvs={me,ru,P};
}
function battleResult(si,win,first,me){
  if(win&&first&&si===STAGES.length-1&&!REC.seenEpi){REC.seenEpi=true;saveRec();return scene(SC.epilogue,{bg:'top'},()=>ending(allClear))}
  const st=STAGES[si],c=CHARS[st.ch];
  const body=shell('けっか','ストーリーへ',story);
  body.innerHTML=`<div class="result"><div class="r-ch">${charHTML(win?HERO:st.ch,'win')}</div>
    <h2 class="display">${win?'あなたの かち！':`${esc(c.name)}の かち`}</h2>
    <p class="note">${win?(first&&si<STAGES.length-1?`つぎの あいてが あらわれた！`:'クリアずみの あいてに かった'):`さいだい ${me.maxChain}れんさ・けした数 ${me.cleared}`}</p>
    <div class="r-btns">${win&&si+1<STAGES.length?`<button class="primary" id="rNext">つぎの あいてへ</button>`:''}
     ${!win?`<button class="primary" id="rAgain">もういちど</button>`:''}<button class="sbtn" id="rList">あいての いちらん</button></div></div>`;
  if($('#rNext'))$('#rNext').onclick=()=>{se('tap');stageIntro(si+1)};
  if($('#rAgain'))$('#rAgain').onclick=()=>{se('tap');battle(si)};
  $('#rList').onclick=()=>{se('tap');story()};
}
function allClear(){
  const body=shell('','タイトルへ',title);$('#gBack').style.visibility='hidden';
  body.innerHTML=`<div class="result"><p class="clear-ttl">ぜんぶ クリア！</p><div class="r-ch">${charHTML(HERO,'win')}</div>
   <p class="note">6人 ぜんいんに かちました。エンドレスで スコアにも ちょうせんしてみよう。</p>
   <div class="r-btns"><button class="primary" id="cEnd">エンドレスへ</button><button class="sbtn" id="cTop">タイトルへ</button></div></div>`;
  $('#cEnd').onclick=()=>{se('tap');endlessPick()};$('#cTop').onclick=()=>{se('tap');title()};
}

/* ---- ていし画面 ---- */
function overlay(html,on){closeOverlay();const o=document.createElement('div');o.className='ovl';o.id='ovl';o.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(o);
  o.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{se('tap');const k=b.dataset.k;closeOverlay();on(k)})}
function closeOverlay(){const o=$('#ovl');if(o)o.remove()}

/* ===== エンドレス ===== */
const ENDLESS_IDS=()=>Object.keys(CHARS);
function endlessPick(){
  const body=shell('エンドレス','タイトルへ',title);
  if(!CHARS[REC.endChar])REC.endChar=HERO;
  const draw=()=>{body.innerHTML=`<div class="card" style="align-items:center;text-align:center"><div class="r-ch" style="height:150px">${charHTML(REC.endChar,'attack')}</div><h3>${esc(CHARS[REC.endChar].name)}</h3><p>キャラは 見た目だけ かわります（つよさは みんな おなじ）</p></div>
    <div class="pick">${ENDLESS_IDS().map(id=>`<button class="${id===REC.endChar?'on':''}" data-id="${id}">${charHTML(id)}<span>${esc(CHARS[id].name)}</span></button>`).join('')}</div>
    <p class="note">じこベスト ${REC.best[0]?REC.best[0].s.toLocaleString()+'てん':'まだ ありません'}</p>
    <button class="primary big" id="eGo" style="align-self:center">スタート</button>`;
    body.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{se('tap');REC.endChar=b.dataset.id;saveRec();draw()});
    $('#eGo').onclick=()=>{unlockAudio();se('tap');endless()}};
  draw();
}
const CHAIN_BONUS=[0,0,50,80,150,300,400,500,700,900,1100,1300,1500,1800];
function endless(){
  const id=REC.endChar||HERO,HL=SC.hero;
  let ended=false,raf=0,t0=performance.now(),score=0,paused=false,pinch=false,ready=false;
  const body=shell('エンドレス','ていし',()=>pauseMenu());
  body.innerHTML=`<div class="pvs" id="pvs"><p class="vs-say" id="pvS">どこまで いけるかな？</p>
   <div class="end-row"><div class="pnl-wrap" style="background-image:url(${IMG.bg})"><div class="pnl-bg big" id="eF">${charHTML(id)}</div><canvas class="me" id="pvA" width="1" height="1"></canvas></div>
    <div class="end-side">
     <div class="stat"><span>スコア</span><b id="eS">0</b></div>
     <div class="stat sm"><span>レベル</span><b id="eL">1</b></div>
     <div class="stat sm"><span>れんさ</span><b id="eC">1</b></div>
     <div class="stat sm"><span>じかん</span><b id="eT">0:00</b></div></div></div>
   ${CTRL_HTML}</div>`;
  const avail=Math.min(body.clientWidth,440)-96,cs=Math.floor(Math.min(avail/6,(viewH()-330)/12));
  const level=el=>Math.min(20,1+Math.floor(el/30));
  const speed=el=>.12+(level(el)-1)*.045;
  let ft=0;const face=(ex,hold)=>{if(ended&&!hold)return;$('#eF').innerHTML=charHTML(id,ex);clearTimeout(ft);if(!hold)ft=setTimeout(()=>{if(!ended)$('#eF').innerHTML=charHTML(id,pinch?'pinch':'normal')},1500)};
  const say=t=>{if(t)$('#pvS').textContent=t};
  const me=makePanelBoard($('#pvA'),cs,{speed,onClear:(n,ch)=>{
      const L=level(me.elapsed);let p=n*10+(n>3?(n-3)*30:0)+(ch>1?CHAIN_BONUS[Math.min(ch,CHAIN_BONUS.length-1)]+(ch>13?(ch-13)*300:0):0);
      score+=Math.round(p*(1+(L-1)*.1));
      if(ch>1||n>3){se('up');face('attack');if(ch>2||n>4)say(pick(HL.attack||[]))}else se('catch')},
    onLose:()=>end()});
  function loop(t){if(ended)return;const dt=Math.min(.05,(t-t0)/1000);t0=t;
    if(!paused&&!ready)cd(dt);
    else if(!paused){me.step(dt);const pm=me.high(9);if(pm&&!pinch){face('pinch',true);say(pick(HL.pinch||[]))}if(!pm&&pinch)face('normal',true);pinch=pm;BGM.rate(pm?1.18:1)}
    me.draw();$('#eS').textContent=score.toLocaleString();$('#eL').textContent=level(me.elapsed);$('#eC').textContent=me.maxChain;$('#eT').textContent=fmtTime(me.elapsed);
    raf=requestAnimationFrame(loop)}
  me.wait=true;const cd=countdown($('#pvs'),()=>{ready=true;me.wait=false});
  raf=requestAnimationFrame(loop);BGM.start('endless');
  padUI($('#pvs'),me);
  const setPause=v=>{paused=me.paused=v;if(v)BGM.pause();else{t0=performance.now();BGM.resume()}};
  function pauseMenu(){if(ended)return;setPause(true);overlay(`<h3>ていし ちゅう</h3><p>スコア ${score.toLocaleString()}</p><button class="primary" data-k="go">つづける</button><button class="sbtn" data-k="retry">さいしょから</button><button class="ghost" data-k="quit">やめて もどる</button>`,k=>{
    if(k==='go')setPause(false);if(k==='retry'){cleanup();endless()}if(k==='quit'){cleanup();endlessPick()}})}
  const onVis=()=>{if(document.hidden&&!paused&&!ended)pauseMenu()};document.addEventListener('visibilitychange',onVis);
  function cleanup(){ended=true;cancelAnimationFrame(raf);BGM.rate(1);document.removeEventListener('visibilitychange',onVis);closeOverlay()}
  stopGame=cleanup;
  function end(){if(ended)return;ended=true;se('miss');face('lose',true);say(pick(HL.lose||[])||'あ〜…');
    setTimeout(()=>{cleanup();BGM.stop();
      const rec={s:score,c:me.maxChain,k:me.cleared,t:Math.round(me.elapsed),h:id,d:today(),n:REC.name||''};
      const prevBest=REC.best[0]?REC.best[0].s:0;
      REC.best.push(rec);REC.best.sort((a,b)=>b.s-a.s);REC.best=REC.best.slice(0,10);REC.maxChain=Math.max(REC.maxChain,me.maxChain);saveRec();
      endlessResult(rec,score>prevBest&&score>0)},1500)}
  if(location.search.includes('debug'))window.__pvs={me,addScore:v=>score+=v};
}
function endlessResult(rec,isBest){
  const body=shell('けっか','もどる',endlessPick);
  body.innerHTML=`<div class="result"><div class="r-ch" style="height:150px">${charHTML(rec.h,isBest?'win':'lose')}</div>
   ${isBest?'<span class="newbest">じこベスト こうしん！</span>':''}
   <h2 class="display">${rec.s.toLocaleString()} てん</h2>
   <div class="r-stats"><div class="stat sm"><span>さいだいれんさ</span><b>${rec.c}</b></div><div class="stat sm"><span>けした数</span><b>${rec.k}</b></div><div class="stat sm"><span>じかん</span><b>${fmtTime(rec.t)}</b></div><div class="stat sm"><span>レベル</span><b>${Math.min(20,1+Math.floor(rec.t/30))}</b></div></div>
   <div class="r-btns"><button class="primary" id="rAgain">もういちど</button><button class="sbtn" id="rRank">ランキング</button></div>
   <div class="card"><h3>みんなの ランキングに のせる</h3>
    <label class="fld" for="rName">ランキングに出す なまえ（10文字まで）<input id="rName" maxlength="10" value="${esc(REC.name)}" placeholder="なまえ"></label>
    <div id="rCodeBox"></div></div></div>`;
  const online=window.HP_ONLINE&&typeof HP_ONLINE.submit==='function';let sent=false;
  const draw=()=>{const nm=$('#rName').value.trim();const box=$('#rCodeBox');
    if(online){
      if(sent){box.innerHTML='<p class="msg">ランキングに のせました！</p>';return}
      if(!nm||rec.s<=0){box.innerHTML=`<p>${rec.s<=0?'スコアが 0 のときは のせられません':'なまえを 入れると おくれます'}</p>`;return}
      box.innerHTML='<button class="primary" id="rSend">ランキングに おくる</button><p class="msg" id="rMsg"></p>';
      $('#rSend').onclick=async e=>{e.target.disabled=true;e.target.textContent='おくっています…';
        try{await HP_ONLINE.submit(Object.assign({},rec,{n:nm}));sent=true;se('good');draw()}
        catch(err){e.target.disabled=false;e.target.textContent='もういちど おくる';const m=$('#rMsg');m.className='msg bad';m.textContent='おくれませんでした。つうしんを たしかめてね'}};
      return}
    if(!nm||rec.s<=0){box.innerHTML=`<p>${rec.s<=0?'スコアが 0 のときは コードが でません':'なまえを 入れると「きろくコード」が でます'}</p>`;return}
    const code=makeCode('R',[nm,rec.s,rec.c,rec.k,rec.t,rec.h,rec.d,Date.now()%100000]);
    box.innerHTML=`<p>この コードを コピーして、ランキングの かかりの人に おくってね。</p><div class="code" id="rCode">${code}</div><button class="sbtn" id="rCopy">コピー</button>`;
    $('#rCopy').onclick=e=>copyText(code,e.target,$('#rCode'))};
  $('#rName').oninput=()=>{REC.name=$('#rName').value.trim();saveRec();draw()};draw();
  $('#rAgain').onclick=()=>{unlockAudio();se('tap');endless()};$('#rRank').onclick=()=>{se('tap');ranking()};
}

/* ===== ランキング ===== */
let rankTab='world';
function ranking(){
  const body=shell('ランキング','タイトルへ',title);
  const online=window.HP_ONLINE&&typeof HP_ONLINE.top==='function';
  const W=online?{list:null,updated:''}:(window.WORLD_RANKING||{list:[]});
  let loadErr=false;
  if(online)HP_ONLINE.top(50).then(l=>{W.list=Array.isArray(l)?l:[];draw()}).catch(()=>{loadErr=true;W.list=[];draw()});
  const rows=(list,showName)=>`<div class="rank-wrap"><table class="rank"><thead><tr><th>じゅんい</th><th>${showName?'なまえ':'ひづけ'}</th><th>スコア</th><th>れんさ</th></tr></thead><tbody>${list.map((r,i)=>`<tr class="top${i+1}"><td>${i+1}</td><td><span class="nm"><span class="pvs-ic">${charHTML(CHARS[r.h]?r.h:HERO)}</span><span>${esc(showName?r.n:r.d)}</span></span></td><td><b>${(+r.s).toLocaleString()}</b></td><td>${r.c}</td></tr>`).join('')}</tbody></table></div>`;
  const draw=()=>{if(!$('#gBody')||$('#gBody')!==body)return;const wl=[...(W.list||[])].sort((a,b)=>b.s-a.s).slice(0,50);
    const worldHTML=W.list===null?'<div class="empty">よみこみ ちゅう…</div>':loadErr?'<div class="empty">ランキングを よみこめませんでした。<br>つうしんを たしかめて、もういちど ひらいてね。</div>':wl.length?rows(wl,true)+`<p class="note">${online?'エンドレスで おくられた きろくです':'きろくコードを おくってくれた人の きろくです'}${W.updated?`（${esc(W.updated)} こうしん）`:''}</p>`:`<div class="empty">まだ だれも のっていません。<br>${online?'エンドレスの けっか画面から おくると、ここに のります。':'エンドレスの けっか画面で でる「きろくコード」を<br>ランキングの かかりの人に おくると、ここに のります。'}</div>`;
    body.innerHTML=`<div class="tabs"><button class="sbtn${rankTab==='world'?' on':''}" data-t="world">みんな</button><button class="sbtn${rankTab==='mine'?' on':''}" data-t="mine">このスマホ</button></div>
    ${rankTab==='world'?worldHTML
     :(REC.best.length?rows(REC.best,false):`<div class="empty">まだ きろくが ありません。<br>エンドレスを あそぶと、ここに じこベストが のこります。</div>`)}
    <button class="primary" id="kGo" style="align-self:center">エンドレスで あそぶ</button>`;
    body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{se('tap');rankTab=b.dataset.t;draw()});
    $('#kGo').onclick=()=>{se('tap');endlessPick()}};
  draw();
}

/* ===== せってい・ひきつぎ ===== */
function settings(){
  const body=shell('せってい・ひきつぎ','タイトルへ',title);
  const save=()=>({v:2,name:REC.name,prog:REC.prog,fails:REC.fails,wins:REC.wins,losses:REC.losses,seenPro:REC.seenPro,seenOp:REC.seenOp,seenEpi:REC.seenEpi,best:REC.best,endChar:REC.endChar,maxChain:REC.maxChain});
  const draw=()=>{const code=makeCode('S',save());
    body.innerHTML=`<div class="card"><h3>なまえ と おと</h3>
     <label class="fld" for="sName">あなたの なまえ（10文字まで）<input id="sName" maxlength="10" value="${esc(REC.name)}" placeholder="あなた"></label>
     <div class="menu-row" style="justify-content:flex-start"><button class="sbtn${REC.bgm?' on':''}" id="sBgm">BGM ${REC.bgm?'ON':'OFF'}</button><button class="sbtn${REC.se?' on':''}" id="sSe">こうかおん ${REC.se?'ON':'OFF'}</button></div></div>
    <div class="card"><h3>ひきつぎコード（べつの スマホへ）</h3>
     <p>ストーリーの すすみぐあいと エンドレスの きろくが はいっています。べつの スマホや ブラウザで「コードを 入れる」に はりつけると、つづきから あそべます。</p>
     <div class="code" id="sCode">${code}</div><button class="sbtn" id="sCopy" style="align-self:flex-start">コピー</button></div>
    <div class="card"><h3>コードを 入れる</h3>
     <label class="fld" for="sIn">ひきつぎコードを はりつけ<textarea class="code" id="sIn" placeholder="HPS-…"></textarea></label>
     <button class="sbtn" id="sLoad" style="align-self:flex-start">この コードで よみこむ</button><p class="msg" id="sMsg"></p></div>
    <p class="note">きろくは この スマホの ブラウザの中に ほぞんされます。ブラウザの データを けすと きえるので、ときどき コードを メモしておくと あんしんです。</p>`;
    $('#sName').oninput=e=>{REC.name=e.target.value.trim();saveRec();$('#sCode').textContent=makeCode('S',save())};
    $('#sBgm').onclick=()=>{BGM.toggle();draw()};
    $('#sSe').onclick=()=>{REC.se=REC.se?0:.8;saveRec();draw()};
    $('#sCopy').onclick=e=>copyText($('#sCode').textContent,e.target,$('#sCode'));
    let pending=null;
    $('#sLoad').onclick=e=>{const m=$('#sMsg');
      if(pending){Object.assign(REC,REC_DEF(),{se:REC.se,bgm:REC.bgm},pending);saveRec();pending=null;draw();$('#sMsg').textContent='よみこみました！';return}
      const d=readCode('S',$('#sIn').value);
      if(!d||typeof d!=='object'||d.v!==2){m.className='msg bad';m.textContent='コードが ちがうようです。さいごまで コピーできているか たしかめてね';return}
      pending={name:String(d.name||'').slice(0,10),prog:clamp(+d.prog||0,0,6),fails:Array.isArray(d.fails)?d.fails.slice(0,6).map(x=>+x||0):[0,0,0,0,0,0],wins:+d.wins||0,losses:+d.losses||0,seenPro:!!d.seenPro,seenOp:!!d.seenOp,seenEpi:!!d.seenEpi,best:Array.isArray(d.best)?d.best.slice(0,10):[],endChar:CHARS[d.endChar]?d.endChar:HERO,maxChain:+d.maxChain||1};
      m.className='msg';m.textContent=`${pending.prog}/6 クリア・エンドレス ${pending.best.length}けん。いまの きろくは うわがきされます。`;e.target.textContent='うわがきして よみこむ'};
  };
  draw();
}

splash();
</script>
