# みったーパズル：update.zip を1つ上げるだけで反映する
# 置き場所：.github/workflows/deploy.yml
name: みったーパズル 反映

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: update.zip があれば ひらいて 上書きする
        run: |
          if [ -f update.zip ]; then
            unzip -o update.zip -d .
            rm update.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "update.zip を反映" || echo "かわったファイルなし"
            git push
          else
            echo "update.zip はありません（そのまま公開します）"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
